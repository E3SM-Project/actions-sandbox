name: md-lint

on:
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, ready_for_review, reopened]
  push:
    branches: [ main ]

  merge_group:
    branches: [ main ]

  workflow_dispatch:

# Cancel in-progress runs for the same PR or branch
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            relevant:
              - '**/*.md'
    outputs:
      relevant: ${{ (github.event_name == 'workflow_dispatch' || github.ref_type == 'tag') && 'true' || steps.filter.outputs.relevant }}
  lint:
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.relevant == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          globs: '**/*.md'
  final:
    name: md-lint-status-check
    runs-on: ubuntu-latest
    needs: [changes,lint]
    if: always()
    steps:
      - name: Verify no job failed
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "Job results: $RESULTS"
          echo "$RESULTS" | jq -e 'all(.[]; . == "success" or . == "skipped")'
