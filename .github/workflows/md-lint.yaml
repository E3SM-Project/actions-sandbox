name: md-lint

on:
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, ready_for_review, reopened]
  push:
    branches: [ main ]

  merge_group:
    branches: [ main ]

  workflow_dispatch:

# Cancel in-progress runs for the same PR or branch
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      relevant: ${{ steps.filter.outputs.relevant || steps.force.outputs.relevant }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name != 'workflow_dispatch' && github.ref_type != 'tag'
        with:
          filters: |
            relevant:
              - '**/*.md'
      - id: force
        if: github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' || github.ref_type == 'tag'
        run: echo "relevant=true" >> "$GITHUB_OUTPUT"

  lint:
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.relevant == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          globs: '**/*.md'
